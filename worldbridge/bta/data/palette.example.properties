# Esempio di personalizzazione per bta2java (usalo con: --palette palette.example.properties)
# Ogni riga è facoltativa: quelle mancanti usano i default (scelti confrontando i colori medi delle texture).
#
# Legno vanilla usato per ogni colore del legno dipinto di BTA (assi, lastre, scale, staccionate,
# cancelli, porte, botole, cartelli, bottoni, pedane). Legni disponibili nel 26.3:
#   oak spruce birch jungle acacia dark_oak mangrove cherry pale_oak bamboo crimson warped poplar
painted.white=pale_oak
painted.orange=acacia
painted.magenta=crimson
painted.light_blue=warped
painted.yellow=bamboo
painted.lime=bamboo
painted.pink=cherry
painted.gray=poplar
painted.light_gray=poplar
painted.cyan=warped
painted.purple=crimson
painted.blue=warped
painted.brown=spruce
painted.green=bamboo
painted.red=mangrove
painted.black=dark_oak

# Legno per le assi di quercia NON dipinte di BTA.
oak=oak

# Cosa diventano i blocchi del portale del Drift (la dimensione Drift diventa The End).
drift_portal=minecraft:air
